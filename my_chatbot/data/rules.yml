version: "3.1"
rules:
- rule: Greet and welcome
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Ask next steps
  steps:
  - intent: ask_next_steps
  - action: utter_suggest_test



