version: "3.1"
nlu:
- intent: greet
  examples: |
    - hi
    - hello

- intent: goodbye
  examples: |
    - bye
    - goodbye

- intent: symptom_report
  examples: |
    - I have a headache and fever
    - I'm coughing and my throat hurts
    - I have chest pain and breathing difficulty
  entities:
    - symptom

- intent: ask_diagnosis
  examples: |
    - What could it be?
    - Can you tell me the possible disease?

- intent: ask_next_steps
  examples: |
    - What should I do?
    - Should I consult a doctor?
