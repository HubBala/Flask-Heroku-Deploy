version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Hello
      - Hi there!
      - Hey

  - intent: symptom_report
    examples: |
      - I have a [headache](symptom) and [fever](symptom)
      - I'm [coughing](symptom) and my [throat hurts](symptom)
      - I have [chest pain](symptom) and [breathing difficulty](symptom)

  - intent: ask_diagnosis
    examples: |
      - What could this be?
      - Do I have a cold or flu?
      - Can you diagnose me?

  - intent: goodbye
    examples: |
      - Bye
      - See you later
      - Goodbye
