version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Hello
      - Hi there!
      - Hey

  - intent: symptom_report
    examples: |
      - I have a headache and fever
      - I'm coughing and my throat hurts
      - I have chest pain and breathing difficulty

  - intent: ask_diagnosis
    examples: |
      - What could this be?
      - Do I have a cold or flu?
      - Can you diagnose me?

  - intent: goodbye
    examples: |
      - Bye
      - See you later
      - Goodbye
